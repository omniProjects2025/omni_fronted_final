<div class="not-found-wrapper">
  <div class="not-found-content" role="main" aria-labelledby="error-code" aria-describedby="error-message">
    <!-- OMNI Hospitals Logo/Brand Element -->
    <div class="brand-logo">
      <img src="assets/images/footer_logo.svg" alt="OMNI Hospitals Logo" class="omni-logo">
    </div>

    <!-- Animated Medical Cross Icon -->
    <svg class="medical-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
      <rect x="45" y="20" width="10" height="60" fill="#0D9CCE"/>
      <rect x="20" y="45" width="60" height="10" fill="#0D9CCE"/>
      <circle cx="50" cy="50" r="35" fill="none" stroke="#0D9CCE" stroke-width="2" opacity="0.3"/>
    </svg>

    <h1 id="error-code" class="error-code">404</h1>
    <h2 class="error-title">Page Not Found</h2>
    <p id="error-message" class="error-message">
      We're sorry, but the page you're looking for doesn't exist or has been moved.
    </p>
    <p class="error-submessage">
      Don't worry, our medical team is here to help you find what you need.
    </p>
    
    <div class="action-buttons">
      <a routerLink="/" class="btn-primary" aria-label="Go back to homepage">
        <i class="fas fa-home"></i>
        Go Back Home
      </a>
      <a routerLink="/contact-us" class="btn-secondary" aria-label="Contact us for help">
        <i class="fas fa-phone"></i>
        Contact Us
      </a>
    </div>

    <!-- Quick Links -->
    <div class="quick-links">
      <h3>Quick Links</h3>
      <div class="links-grid">
        <a routerLink="/our-doctors" class="quick-link">
          <i class="fas fa-user-md"></i>
          Our Doctors
        </a>
        <a routerLink="/our-specialities" class="quick-link">
          <i class="fas fa-stethoscope"></i>
          Specialities
        </a>
        <a routerLink="/book-an-appointment" class="quick-link">
          <i class="fas fa-calendar-alt"></i>
          Book Appointment
        </a>
      </div>
    </div>
  </div>
</div>
