<app-header></app-header>
<ng-container>
  <section class="bg-white">
    <div class="container">
      <ng-container *ngIf="selectedDepartment">
        <div class="row pt-5">
          <!-- Left Card Section -->
          <div class="col-lg-7 col-md-12 mb-4">
            <div class="card">
              <img [src]="selectedDepartment['img']" class="border_rad img-fluid w-100" alt="Medical Image">

            </div>

            <!-- Mobile-only quick link to Book section (visible only on small screens) -->
            <div class="d-block d-lg-none text-center mt-1">
              <!-- Mobile quick link as a button element (blinking faster: 2s visible / 2s hidden). -->
              <button type="button" class="mobile-blink-text" (click)="scrollToBook()" aria-label="Scroll down to appointment section">Scroll Down to Appointment Form</button>
            </div>
          </div>
          <!-- Right Enquiry Form (desktop only - hidden on mobile, mobile copy appears below content) -->
          <div class="col-lg-5 col-md-12 d-flex flex-column align-items-center d-none d-lg-flex">
            <div class="text-center w-100 mt-5">
              <h5
                class="text-black fw-bold text-center position-relative d-flex align-items-center justify-content-center">
                <span class="border-line me-2"></span> ENQUIRY <span class="border-line ms-2"></span>
              </h5>
            </div>

            <!-- Form (desktop only) -->
            <form id="book-appointment-desktop" class="card p-4 form-card w-100" #enquiryForm="ngForm">
              <div class="mb-3 position-relative">
                <input type="text" class="form-control floating-input" name="fullName" placeholder=" "
                  [(ngModel)]="enquiry.fullName" required>
                <label class="floating-label">Full Name <span class="required-star" aria-hidden="true">*</span></label>
              </div>

              <div class="mb-3 position-relative">
                <input type="tel" class="form-control floating-input" name="phoneNumber" placeholder=" "
                  [(ngModel)]="enquiry.phoneNumber" required>
                <label class="floating-label">Phone Number <span class="required-star" aria-hidden="true">*</span></label>
              </div>

              <div class="mb-3 position-relative">
                <input type="email" class="form-control floating-input" name="emailId" placeholder=" "
                  [(ngModel)]="enquiry.emailId">
                <label class="floating-label">Email ID</label>
              </div>

              <div class="mb-3 position-relative">
                <textarea class="form-control floating-input" name="message" rows="3" placeholder=" "
                  [(ngModel)]="enquiry.message"></textarea>
                <label class="floating-label">Message</label>
              </div>

              <!-- Non-editable Department -->
              <div class="mb-3 position-relative">
                <input type="text" class="form-control floating-input" [value]="getDepartmentName()" readonly>
              </div>

              <!-- Submit Button -->
              <div class="text-center w-100 my-4" (click)="submitEnquiry()">
                <button type="submit" class="btn btn-outline-dark px-5 py-1 submit-btn">Submit</button>
              </div>
            </form>
          </div>
        </div>
        <div class="row">
          <div class="col-12 col-md-12">
            <div class="card-body">
              <h4 class="titile_txt">{{ selectedDepartment.name }}</h4>
              <ng-container *ngFor="let desc of selectedDepartment.details">
                <h5 [innerHTML]="desc.title"></h5>
                <h6 *ngIf="desc.subtitle" [innerHTML]="desc.subtitle"></h6>
                <p *ngFor="let data of desc.description" [innerHTML]="data"></p>
                <ng-container *ngIf="desc.para">
                  <p *ngFor="let desc_para of desc.para" [innerHTML]="desc_para"></p>
                </ng-container>
                <ul>
                  <li *ngFor="let item of desc.list" [innerHTML]="item"></li>
                </ul>
                <ng-container *ngFor="let sec of desc?.sections">
                  <h6>{{sec.subtitle}}</h6>
                  <p class="m-0">{{sec.heading}}</p>
                  <p *ngFor="let data of sec?.description" [innerHTML]="data | newlineToBr"></p>
                  <ul>
                    <li *ngFor="let item of sec.list">{{item}}</li>
                  </ul>
                </ng-container>
                <p>{{desc.conclusion}}</p>
              </ng-container>

            </div>
          </div>

        </div>
                <ng-container *ngIf="selectedDepartment?.sub_departments && selectedDepartment?.sub_departments.length > 0">
          <section>
            <div class="row">
              <div class="col-lg-4 col-md-6 mb-4" *ngFor="let subDept of selectedDepartment.sub_departments">
                <div class="sub-dept-border-box">
                  <a [href]="subDept.url" class="sub-dept-link-text">{{subDept.name}}</a>
                </div>
              </div>
            </div>
          </section>
        </ng-container>
        <!-- Mobile-only Book Appointment (duplicate of the form, shown only on small screens and placed after content) -->
        <div class="row d-block d-lg-none mt-4">
          <div class="col-12">
            <div class="text-center w-100 mt-2">
              <h5 class="text-black fw-bold text-center position-relative d-flex align-items-center justify-content-center">
                <span class="border-line me-2"></span> BOOK AN APPOINTMENT <span class="border-line ms-2"></span>
              </h5>
            </div>

            <form id="book-appointment-mobile" class="card p-4 form-card w-100">
              <div class="mb-3 position-relative">
                <input type="text" class="form-control floating-input" name="fullNameMobile" placeholder=" "
                  [(ngModel)]="enquiry.fullName" required>
                <label class="floating-label">Full Name <span class="required-star" aria-hidden="true">*</span></label>
              </div>

              <div class="mb-3 position-relative">
                <input type="tel" class="form-control floating-input" name="phoneNumberMobile" placeholder=" "
                  [(ngModel)]="enquiry.phoneNumber" required>
                <label class="floating-label">Phone Number <span class="required-star" aria-hidden="true">*</span></label>
              </div>

              <div class="mb-3 position-relative">
                <input type="email" class="form-control floating-input" name="emailIdMobile" placeholder=" "
                  [(ngModel)]="enquiry.emailId">
                <label class="floating-label">Email ID</label>
              </div>

              <div class="mb-3 position-relative">
                <textarea class="form-control floating-input" name="messageMobile" rows="3" placeholder=" "
                  [(ngModel)]="enquiry.message"></textarea>
                <label class="floating-label">Message</label>
              </div>

              <!-- Non-editable Department -->
              <div class="mb-3 position-relative">
                <input type="text" class="form-control floating-input" [value]="getDepartmentName()" readonly>
              </div>

              <!-- Submit Button -->
              <div class="text-center w-100 my-4" (click)="submitEnquiry()">
                <button type="submit" class="btn btn-outline-dark px-5 py-1 submit-btn">Submit</button>
              </div>
            </form>
          </div>
        </div>
        
                <!-- FAQs: Render only when faqs array exists and has items -->
                <section class="faqs-section py-5" *ngIf="selectedDepartment?.faqs && selectedDepartment?.faqs.length > 0">
                  <div class="container">
                    <div class="row">
                      <div class="col-12">
                        <h2 class="section-title text-center mb-5">Frequently Asked Questions</h2>
                        <div class="accordion" id="specialityFaqAccordion">
                          <div class="accordion-item" *ngFor="let faq of selectedDepartment.faqs; let i = index">
                            <h3 class="accordion-header" [id]="'headingSpec' + i">
                              <button
                                class="accordion-button" 
                                [class.collapsed]="i !== 0"
                                type="button"
                                data-bs-toggle="collapse"
                                [attr.data-bs-target]="'#specCollapse' + i"
                                [attr.aria-expanded]="i === 0 ? 'true' : 'false'"
                                [attr.aria-controls]="'specCollapse' + i">
                                <span class="faq-question">{{ faq.question }}</span>
                              </button>
                            </h3>
                            <div [id]="'specCollapse' + i"
                                 class="accordion-collapse collapse"
                                 [class.show]="i === 0"
                                 [attr.aria-labelledby]="'headingSpec' + i"
                                 data-bs-parent="#specialityFaqAccordion">
                              <div class="accordion-body">
                                <div class="faq-answer">{{ faq.answer }}</div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </section>
      </ng-container>
    </div>
  </section>
</ng-container>

<app-footer></app-footer>

<!-- Mobile-only blinking quick-book button (middle-left) -->
<button class="mobile-blink-btn d-block d-lg-none" *ngIf="false" (click)="scrollToBook()" aria-label="Book an appointment">
  <span class="icon">📅</span>
  <span class="btn-text">Go to Booking Section</span>
</button>
